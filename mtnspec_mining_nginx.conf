# ============================================================
# NGINX REVERSE PROXY CONFIGURATION FOR MTNSPEC MINING HUB
# Domain: mining.mtnspec.co.zw
# Organization: MTNSPEC (Mhandu Technologies & Network Specialties)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name mining.mtnspec.co.zw;

    # Redirect all HTTP traffic to HTTPS (Cloudflare or Let's Encrypt)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mining.mtnspec.co.zw;

    # SSL Certificates (Cloudflare Origin Certificate or Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/mining.mtnspec.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mining.mtnspec.co.zw/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size (for optical rock specimen photos)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy to FastAPI / Uvicorn Backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for satellite tile streaming and ML inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Cache static assets (images, Leaflet tiles, GeoJSON)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|geojson)$ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
